name: 编译 APK (Play Release)

on:
  schedule:
    - cron: '30 16,4 * * *'
  workflow_dispatch:

concurrency:
  group: orange-build-apk
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: 检查最近12小时有无新提交（API 先判）
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            SINCE=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            COUNT=$(gh api "repos/${{ github.repository }}/commits?sha=master&since=$SINCE&per_page=100" --jq 'length' 2>/dev/null || echo 1)
            if [ "$COUNT" -eq 0 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "⏭️ 12小时内无新提交，跳过本次编译"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "✅ 12小时内有 $COUNT 次提交，继续编译"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "👆 手动触发，继续编译"
          fi

      - if: steps.check.outputs.skip != 'true'
        name: 拉取代码（含子模块）
        uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive
          fetch-depth: 1

      - if: steps.check.outputs.skip != 'true'
        name: 安装 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - if: steps.check.outputs.skip != 'true'
        name: 安装 NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - if: steps.check.outputs.skip != 'true'
        name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - if: steps.check.outputs.skip != 'true'
        name: 配置签名密钥（仓库内置 ci-signing）
        run: |
          if [ -f ci-signing/release.jks ]; then
            {
              echo "storeFile=${{ github.workspace }}/ci-signing/release.jks"
              cat ci-signing/signing.properties
            } >> local.properties
            echo "✅ 使用仓库内置签名密钥（每次构建签名一致，可覆盖安装）"
          else
            echo "⚠️ 未找到 ci-signing/release.jks，将使用 debug 签名"
          fi

      - if: steps.check.outputs.skip != 'true'
        name: 编译 Play Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assemblePlayRelease -x lintVitalPlayRelease

      - if: steps.check.outputs.skip != 'true'
        name: 查找编译出的 APK
        id: find-apk
        run: |
          APK=$(find app/build/outputs/apk/play/release -name "*.apk" | head -1)
          echo "找到 APK: $APK"
          ls -lh "$APK"
          echo "apk-path=$APK" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.skip != 'true'
        name: 立即备份 APK 到 Actions 工件
        uses: actions/upload-artifact@v4
        with:
          name: orangeisland-play-release
          path: ${{ steps.find-apk.outputs.apk-path }}
          retention-days: 7

      - if: steps.check.outputs.skip != 'true'
        name: 生成 Release 标签名
        id: tag
        run: |
          TAG="build-$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "标签: ${TAG}"

      - if: steps.check.outputs.skip != 'true'
        name: 创建 Release + 上传 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Orange Island ${{ steps.tag.outputs.tag }}
          body: |
            Orange Island Play Release APK
            架构: arm64-v8a | 自动编译于 GitHub Actions
          files: ${{ steps.find-apk.outputs.apk-path }}
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建失败自动建 Issue
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const repo = await github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo });
            if (!repo.data.has_issues) { console.log('仓库未启用 Issues，跳过'); return; }
            const title = `⛔ APK 构建失败 #${context.runId}`;
            const q = `repo:${context.repo.owner}/${context.repo.repo} type:issue state:open in:title "${title}"`;
            const { data: search } = await github.rest.search.issuesAndPullRequests({ q });
            if (search.total_count > 0) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '构建失败详情：',
                `- 触发方式：${context.eventName}`,
                `- 分支：${context.ref}`,
                `- 运行日志：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '本 Issue 由 Actions 自动创建，构建成功后请手动关闭。',
              ].join('\n')
            });
