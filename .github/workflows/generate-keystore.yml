name: 生成签名密钥（一次性）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 生成 keystore
        run: |
          mkdir -p ci-signing
          keytool -genkeypair -v \
            -keystore ci-signing/release.jks \
            -alias orangeisland \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass OrangeIslandCI2026 -keypass OrangeIslandCI2026 \
            -dname "CN=Orange Island, OU=CI, O=ook826092-cloud, C=CN" 2>&1 | tail -3
          cat > ci-signing/signing.properties <<'EOF'
          storePassword=OrangeIslandCI2026
          keyAlias=orangeisland
          keyPassword=OrangeIslandCI2026
          EOF
          ls -la ci-signing/

      - name: 提交到仓库
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f ci-signing/
          git commit -m "添加 CI 签名密钥（一次性生成，长期有效）"
          git push origin master
